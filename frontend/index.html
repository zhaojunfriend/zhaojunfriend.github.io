<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown 编辑器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">✏️ Markdown 编辑器</span>
    </div>
    <div class="header-center">
      <input
        id="filename-input"
        class="filename-input"
        type="text"
        placeholder="文件名（如 my-note）"
        value="untitled"
        spellcheck="false"
      />
      <span class="filename-ext">.md</span>
    </div>
    <div class="header-right">
      <button id="btn-new"    class="btn btn-secondary" title="新建文件">新建</button>
      <button id="btn-open"   class="btn btn-secondary" title="打开文件">打开</button>
      <button id="btn-save"   class="btn btn-primary"   title="保存文件 (Ctrl+S)">保存</button>
      <button id="btn-delete" class="btn btn-danger"    title="删除文件">删除</button>
    </div>
  </header>

  <!-- ===== Toolbar ===== -->
  <div class="toolbar">
    <button class="tool-btn" data-action="bold"        title="加粗 (Ctrl+B)"><b>B</b></button>
    <button class="tool-btn" data-action="italic"      title="斜体 (Ctrl+I)"><i>I</i></button>
    <button class="tool-btn" data-action="strikethrough" title="删除线"><s>S</s></button>
    <span class="toolbar-sep"></span>
    <button class="tool-btn" data-action="h1"   title="一级标题">H1</button>
    <button class="tool-btn" data-action="h2"   title="二级标题">H2</button>
    <button class="tool-btn" data-action="h3"   title="三级标题">H3</button>
    <span class="toolbar-sep"></span>
    <button class="tool-btn" data-action="ul"   title="无序列表">• 列表</button>
    <button class="tool-btn" data-action="ol"   title="有序列表">1. 列表</button>
    <button class="tool-btn" data-action="task" title="任务列表">☐ 任务</button>
    <span class="toolbar-sep"></span>
    <button class="tool-btn" data-action="link"  title="插入链接">🔗</button>
    <button class="tool-btn" data-action="image" title="插入图片">🖼️</button>
    <button class="tool-btn" data-action="code"  title="行内代码">&lt;/&gt;</button>
    <button class="tool-btn" data-action="codeblock" title="代码块">```</button>
    <button class="tool-btn" data-action="quote" title="引用">❝</button>
    <button class="tool-btn" data-action="table" title="插入表格">⊞</button>
    <button class="tool-btn" data-action="hr"    title="分割线">—</button>
    <span class="toolbar-sep"></span>
    <button class="tool-btn" data-action="undo"  title="撤销 (Ctrl+Z)">↩</button>
    <button class="tool-btn" data-action="redo"  title="重做 (Ctrl+Y)">↪</button>
    <span class="toolbar-sep"></span>
    <button id="btn-toggle-preview" class="tool-btn active" title="切换预览">👁 预览</button>
    <button id="btn-fullscreen"     class="tool-btn"        title="全屏编辑">⛶ 全屏</button>
  </div>

  <!-- ===== Main Pane ===== -->
  <main class="editor-container" id="editor-container">
    <div class="editor-pane" id="editor-pane">
      <textarea
        id="editor"
        class="editor-textarea"
        placeholder="在这里输入 Markdown 内容……"
        spellcheck="false"
      ></textarea>
      <div class="editor-status">
        <span id="char-count">0 字符</span>
        <span id="word-count">0 词</span>
        <span id="line-count">1 行</span>
      </div>
    </div>

    <div class="resize-handle" id="resize-handle"></div>

    <div class="preview-pane" id="preview-pane">
      <div id="preview" class="preview-content"></div>
    </div>
  </main>

  <!-- ===== File List Modal ===== -->
  <div id="file-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2>已保存的文件</h2>
        <button id="modal-close" class="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <ul id="file-list" class="file-list"></ul>
        <p id="file-list-empty" class="file-list-empty hidden">暂无已保存的文件。</p>
      </div>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div id="toast" class="toast hidden"></div>

  <!-- marked.js for Markdown → HTML conversion (vendored) -->
  <script src="marked.min.js"></script>
  <!-- highlight.js for syntax highlighting in code blocks (vendored) -->
  <link rel="stylesheet" href="highlight.css" />
  <script src="highlight.bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
